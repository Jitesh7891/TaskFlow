# TaskFlow - Render Blueprint
# Deploy: Render Dashboard → New → Blueprint → Connect this repo
# Render will read this file and create both services automatically.

services:
  # ── API Server ──────────────────────────────────────
  - type: web
    name: taskflow-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: MONGODB_URI
        sync: false  # Render prompts you for this on first deploy
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        sync: false  # Set to your frontend URL
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "100"

  # ── Background Worker ───────────────────────────────
  - type: worker
    name: taskflow-worker
    runtime: docker
    plan: starter  # Workers can't use free plan
    dockerCommand: node worker/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
