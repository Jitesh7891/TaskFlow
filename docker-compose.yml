version: '3.8'

services:
  # Database
  mongo:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - taskflow-network

  # Cache & Queue
  redis:
    image: redis:7.0-alpine
    ports:
      - "6379:6379"
    networks:
      - taskflow-network

  # Backend API
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb://mongo:27017/taskflow
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=your_docker_jwt_secret_key_change_in_production
      - JWT_EXPIRES_IN=7d
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX_REQUESTS=10000
    depends_on:
      - mongo
      - redis
    networks:
      - taskflow-network
    command: npm run dev

  # Background Worker
  worker:
    build: .
    environment:
      - MONGODB_URI=mongodb://mongo:27017/taskflow
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - mongo
      - redis
    networks:
      - taskflow-network
    command: npm run worker:dev


networks:
  taskflow-network:
    driver: bridge

volumes:
  mongo-data:
